<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Kafka Streams</title>
  <!-- Cesium (기존 로직 보존용) : 필요 시 버전을 기존과 맞추세요 -->
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
  <style>
    :root {
      --bg: #0f172a; /* slate-900 */
      --panel: #111827; /* gray-900 */
      --panel-2: #0b1220; /* darker */
      --text: #e5e7eb; /* gray-200 */
      --muted: #9ca3af; /* gray-400 */
      --accent: #60a5fa; /* blue-400 */
      --accent-2: #22d3ee; /* cyan-400 */
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    a { color: var(--accent); text-decoration: none; }

    .layout { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    .sidebar { background: var(--panel); border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
    .sidebar header { padding: 14px 16px; border-bottom: 1px solid #1f2937; font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
    .sidebar section { padding: 12px 12px; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { background: #1f2937; color: var(--muted); padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid #111827; }

    .input-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
    .input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #1f2937; background: var(--panel-2); color: var(--text); outline: none; }
    .btn { padding: 10px 12px; border-radius: 10px; border: 1px solid #1f2937; background: #162036; color: var(--text); cursor: pointer; font-weight: 600; }
    .btn:hover { background: #1a2542; }

    .list { display: grid; gap: 6px; margin-top: 10px; }
    .list-item { border: 1px solid #1f2937; background: #0b1220; padding: 10px; border-radius: 10px; display: grid; gap: 6px; }
    .list-item .title { font-weight: 600; }
    .list-item .sub { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .grow { flex: 1; }
    .pill { font-size: 11px; color: #93c5fd; background: #0b264b; padding: 3px 8px; border-radius: 999px; border: 1px solid #12315c; }

    .content { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1f2937; background: #0b1220; }
    .topbar .room { font-weight: 700; }
    .topbar .status { margin-left: auto; font-size: 12px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.ok { background: var(--ok); box-shadow: 0 0 0 2px rgba(34,197,94,.2); }
    .status-dot.bad { background: var(--danger); box-shadow: 0 0 0 2px rgba(239,68,68,.2); }

    .viewer-wrap { position: relative; }
    #cesiumContainer { width: 100%; height: 100%; }

    .bottombar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid #1f2937; background: #0b1220; font-size: 12px; color: var(--muted); }
    .bottombar .hint { color: #9ca3af; }

    .tabs { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid #1f2937; background: #0b1220; }
    .tab { padding: 6px 10px; border: 1px solid #1f2937; background: #0c1a33; border-radius: 999px; cursor: pointer; font-size: 13px; }
    .tab.active { background: #12315c; color: #cfe2ff; border-color: #143a6b; }
    .tab .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; margin-right: 6px; background: #475569; }
    .tab.connected .dot { background: #22c55e; }
    .tab.error .dot { background: #ef4444; }

    .room-actions { display: flex; gap: 6px; }
    .icon-btn { padding: 6px 8px; border-radius: 8px; border: 1px solid #1f2937; background: #12203b; color: var(--text); cursor: pointer; font-size: 12px; }
    .icon-btn:hover { background: #172a50; }

    .empty { color: var(--muted); font-size: 14px; padding: 10px; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar: Lobby -->
    <aside class="sidebar">
      <header>
        <span>📡 Realtime Lobby</span>
      </header>

      <section>
        <div class="badges"></div>

        <div class="input-row">
          <input id="roomUrlInput" class="input" type="text" placeholder="실시간 주소(HTTP) 붙여넣기 → 추가" />
          <button id="addRoomBtn" class="btn">추가</button>
        </div>

        <div class="list" id="myRooms"></div>
      </section>

      <section>
        <div class="row">
          <div class="grow" style="font-weight:700">접속 가능 목록 (탐색)</div>
          <button id="refreshBtn" class="icon-btn">🔄 새로고침</button>
        </div>
        <div class="list" id="availableList"></div>
        <div id="availableEmpty" class="empty" style="display:none">목록을 찾지 못했습니다. 상단 입력창에 주소를 직접 추가하세요.</div>
      </section>
    </aside>

    <!-- Main: Tabs + Cesium Viewer -->
    <main class="content">
      <div class="tabs" id="tabs"></div>
      <div class="topbar">
        <div class="room" id="currentRoomTitle">방에 들어가면 여기 표시됩니다</div>
        <div class="room-actions">
          <button id="disconnectBtn" class="icon-btn" title="연결 끊기">⏹ 끊기</button>
          <button id="reconnectBtn" class="icon-btn" title="재연결">🔁 재연결</button>
          <button id="clearBtn" class="icon-btn" title="화면 초기화">🧹 초기화</button>
        </div>
        <div class="status" id="connStatus"><span class="status-dot bad"></span>연결 안 됨</div>
      </div>

      <div class="viewer-wrap">
        <div id="cesiumContainer"></div>
      </div>

      <div class="bottombar">
        <div class="hint">힌트: 여러 주소(토픽)를 추가해두고 탭처럼 전환하세요. 한 번에 하나의 방만 실시간 수신합니다.</div>
      </div>
    </main>
  </div>

  <script>
    // ======= 앱 설정(에러 최소화) =======
    const CONFIG = {
      // 서버가 /realtime/list 또는 /streams 엔드포인트를 제공하지 않는 경우 false로 두면 콘솔 404가 사라집니다.
      ENABLE_DISCOVERY: false,
      // Cesium Ion 토큰. 없다면 null로 두면 OSM 타일로 자동 대체되어 401이 사라집니다.
      CESIUM_ION_TOKEN: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzMjM0YTQ5OS01MTgwLTRjODItYTk0MS04ODQ4ODE2YTdhNTEiLCJpZCI6MzI5MzEwLCJpYXQiOjE3NTQ0NzE0Mzd9.EuurwTHYuKDK-CHcjh1a22P4O6ijJNlb6f2qx8fZctA',
    };
    // ======= 유틸 =======
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    function toWsUrl(httpUrl) {
      try {
        const u = new URL(httpUrl);
        if (u.protocol === 'http:') u.protocol = 'ws:';
        if (u.protocol === 'https:') u.protocol = 'wss:';
        // 서버가 WebSocket 엔드포인트를 동일 경로로 처리한다고 가정
        return u.toString();
      } catch (e) {
        return httpUrl; // fallback
      }
    }

    function short(s, n = 64) { return s.length > n ? s.slice(0, n - 3) + '...' : s; }

    // 간단한 쓰로틀 (과도한 렌더링 방지)
    function throttle(fn, ms) {
      let last = 0; let timer;
      return function(...args) {
        const now = performance.now();
        if (now - last >= ms) {
          last = now; return fn.apply(this, args);
        }
        clearTimeout(timer);
        timer = setTimeout(() => { last = performance.now(); fn.apply(this, args); }, ms);
      };
    }

    // ======= 상태 =======
    const state = {
      rooms: [], // { id, httpUrl, wsUrl, title, status: 'idle'|'connecting'|'open'|'error' }
      activeRoomId: null,
      socket: null,
      viewer: null,
      // Cesium 관련 사용자 로직이 활용할 수 있는 공유 컨텍스트
      cesium: {
        entities: null,
        // 필요 시 여기에 카메라, 경로, 샘플러 등 저장
      },
    };

    // ======= 로컬스토리지 =======
    const LS_KEY = 'realtime-lobby-rooms-v1';
    function loadRooms() {
      try { const raw = localStorage.getItem(LS_KEY); if (!raw) return []; return JSON.parse(raw); } catch { return []; }
    }
    function saveRooms() { localStorage.setItem(LS_KEY, JSON.stringify(state.rooms)); }

    // ======= UI 렌더링 =======
    function renderSidebarRooms() {
      const wrap = $('#myRooms');
      wrap.innerHTML = '';
      if (!state.rooms.length) {
        const div = document.createElement('div');
        div.className = 'empty';
        div.textContent = '추가한 방이 없습니다. 위 입력창에 주소를 붙여넣고 "추가"를 눌러보세요.';
        wrap.appendChild(div);
        return;
      }
      state.rooms.forEach((r) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="row">
            <div class="title grow">${short(r.title || r.httpUrl, 40)}</div>
            <span class="pill">${r.status === 'open' ? '연결됨' : r.status === 'connecting' ? '연결중' : r.status === 'error' ? '오류' : '대기'}</span>
          </div>
          <div class="sub">${r.httpUrl}</div>
          <div class="row">
            <button class="btn" data-act="enter">입장</button>
            <button class="icon-btn" data-act="copy">📋 URL 복사</button>
            <button class="icon-btn" data-act="remove">🗑 삭제</button>
          </div>
        `;
        item.querySelector('[data-act="enter"]').onclick = () => activateRoom(r.id);
        item.querySelector('[data-act="copy"]').onclick = () => (navigator.clipboard.writeText(r.httpUrl));
        item.querySelector('[data-act="remove"]').onclick = () => removeRoom(r.id);
        wrap.appendChild(item);
      });
    }

    function renderTabs() {
      const tabs = $('#tabs');
      tabs.innerHTML = '';
      state.rooms.forEach((r) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (state.activeRoomId === r.id ? ' active' : '') + (r.status === 'open' ? ' connected' : (r.status === 'error' ? ' error' : ''));
        btn.innerHTML = `<span class="dot"></span>${short(r.title || r.httpUrl, 32)}`;
        btn.onclick = () => activateRoom(r.id);
        tabs.appendChild(btn);
      });
    }

    function setTopbarStatus(kind, text) {
      const el = $('#connStatus');
      el.innerHTML = `<span class="status-dot ${kind === 'ok' ? 'ok' : 'bad'}"></span>${text}`;
    }

    function updateActiveRoomTitle() {
      const room = state.rooms.find(r => r.id === state.activeRoomId);
      $('#currentRoomTitle').textContent = room ? (room.title || room.httpUrl) : '방에 들어가면 여기 표시됩니다';
    }

    // ======= 방 관리 =======
    function addRoom(httpUrl) {
      if (!httpUrl) return;
      const id = 'room_' + Math.random().toString(36).slice(2);
      const room = { id, httpUrl, wsUrl: toWsUrl(httpUrl), title: extractTitleFromUrl(httpUrl), status: 'idle' };
      state.rooms.push(room); saveRooms();
      renderSidebarRooms(); renderTabs();
    }

    function extractTitleFromUrl(u) {
      try { const url = new URL(u); const topic = url.searchParams.get('topic'); return topic ? `${url.hostname} • ${topic}` : `${url.hostname}${url.pathname}`; } catch { return u; }
    }

    function removeRoom(id) {
      // 활성 방 제거 시 연결도 끊음
      if (state.activeRoomId === id) disconnect();
      state.rooms = state.rooms.filter(r => r.id !== id); saveRooms();
      renderSidebarRooms(); renderTabs(); updateActiveRoomTitle();
    }

    async function activateRoom(id) {
      if (state.activeRoomId === id) return; // 이미 활성화
      state.activeRoomId = id;
      renderTabs(); updateActiveRoomTitle();
      // 연결 스위칭: 기존 연결 정리 후 새 연결
      disconnect();
      clearCesiumScene();
      await connectActive();
    }

    // ======= 연결 제어 =======
    function disconnect() {
      if (state.socket) {
        try { state.socket.close(); } catch {}
        state.socket = null;
      }
      setTopbarStatus('bad', '연결 안 됨');
      const r = state.rooms.find(r => r.id === state.activeRoomId);
      if (r) { r.status = 'idle'; renderSidebarRooms(); renderTabs(); }
    }

    async function connectActive() {
      const room = state.rooms.find(r => r.id === state.activeRoomId);
      if (!room) return;
      room.status = 'connecting'; renderSidebarRooms(); renderTabs();
      setTopbarStatus('bad', '연결중...');

      // WebSocket 연결
      try {
        const ws = new WebSocket(room.wsUrl);
        state.socket = ws;
        ws.onopen = () => {
          room.status = 'open'; renderSidebarRooms(); renderTabs();
          setTopbarStatus('ok', '연결됨');
        };
        ws.onerror = () => {
          room.status = 'error'; renderSidebarRooms(); renderTabs();
          setTopbarStatus('bad', '오류 발생');
        };
        ws.onclose = () => {
          if (room.status !== 'error') room.status = 'idle';
          renderSidebarRooms(); renderTabs();
          setTopbarStatus('bad', '연결 종료');
        };

        // 메시지 처리 (쓰로틀)
        const handleMsg = throttle((evt) => {
          try {
            const payload = typeof evt.data === 'string' ? JSON.parse(evt.data) : evt.data;
            processIncomingData(payload);
          } catch (e) {
            // payload가 JSON이 아니면 문자열로 전달
            processIncomingData(evt.data);
          }
        }, 50); // 20Hz로 제한 (원하면 조정)

        ws.onmessage = handleMsg;
      } catch (e) {
        room.status = 'error'; renderSidebarRooms(); renderTabs();
        setTopbarStatus('bad', '연결 실패');
      }
    }

    // ======= 사용 가능한 주소(방) 탐색 =======
    async function discoverAvailable() {
      const availableList = $('#availableList');
      const empty = $('#availableEmpty');
      availableList.innerHTML = '';
      empty.style.display = 'none';

      // ▼ 서버가 목록 API를 제공하지 않으면 바로 종료하여 404를 피함
      if (!CONFIG.ENABLE_DISCOVERY) {
        empty.style.display = 'block';
        return;
      }

      // 서버 구현에 따라 다음 우선순위로 시도
      const candidates = [
        async () => {
          const base = window.location.origin.replace(/:\\d+$/, ':4882');
          const url = base + '/realtime/list';
          const res = await fetch(url, { method: 'GET' });
          if (!res.ok) throw new Error('no list');
          const j = await res.json();
          if (!Array.isArray(j.topics)) throw new Error('bad format');
          return j.topics.map(t => `${base}/realtime?topic=${encodeURIComponent(t)}`);
        },
        async () => {
          const base = window.location.origin.replace(/:\\d+$/, ':4882');
          const url = base + '/streams';
          const res = await fetch(url, { method: 'GET' });
          if (!res.ok) throw new Error('no /streams');
          const j = await res.json();
          if (!Array.isArray(j)) throw new Error('bad format');
          return j.map(t => `${base}/realtime?topic=${encodeURIComponent(t)}`);
        },
      ];

      // 순차 시도
      let urls = [];
      (async () => {
        for (const fn of candidates) {
          try { urls = await fn(); if (urls.length) break; } catch (e) { /* 계속 다음 시도 */ }
        }

        if (!urls.length) {
          empty.style.display = 'block';
          return;
        }

        urls.forEach((u) => {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="title">${extractTitleFromUrl(u)}</div>
            <div class="sub">${u}</div>
            <div class="row">
              <button class="btn" data-act="add">내 방에 추가</button>
              <button class="icon-btn" data-act="enter">바로 입장</button>
            </div>
          `;
          item.querySelector('[data-act="add"]').onclick = () => { addRoom(u); };
          item.querySelector('[data-act="enter"]').onclick = () => { addRoom(u); const last = state.rooms[state.rooms.length-1]; activateRoom(last.id); };
          availableList.appendChild(item);
        });
      })();
    }

    // ======= Cesium 초기화 & 화면 관리 =======
    function initCesium() {
      // Ion 토큰이 있으면 사용, 없으면 OSM으로 대체하여 401 방지
      if (CONFIG.CESIUM_ION_TOKEN) {
        Cesium.Ion.defaultAccessToken = CONFIG.CESIUM_ION_TOKEN;
        state.viewer = new Cesium.Viewer('cesiumContainer', {
          animation: false,
          timeline: false,
          baseLayerPicker: true,
          geocoder: false,
          homeButton: true,
          navigationHelpButton: false,
          selectionIndicator: false,
          sceneModePicker: true,
        });
      } else {
        // 공개 OSM 타일 사용 (Ion 불필요)
        const osm = new Cesium.UrlTemplateImageryProvider({
          url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        });
        state.viewer = new Cesium.Viewer('cesiumContainer', {
          imageryProvider: osm,
          terrainProvider: new Cesium.EllipsoidTerrainProvider(),
          animation: false,
          timeline: false,
          baseLayerPicker: false,
          geocoder: false,
          homeButton: true,
          navigationHelpButton: false,
          selectionIndicator: false,
          sceneModePicker: true,
        });
      }

      state.cesium.entities = state.viewer.entities;
      // 초기 카메라
      try {
        state.viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(127.0, 37.5, 1000000),
        });
      } catch {}
    }

    function clearCesiumScene() {
      if (!state.viewer) return;
      state.viewer.entities.removeAll();
      // 경로 샘플러/데이터소스 등을 썼다면 여기서 정리
    }

    // ======= 🔴 핵심: 기존 "세슘 표시 로직"을 이 함수 안으로 옮겨주세요 =======
    // payload: 서버에서 오는 메시지 1건 (JSON 객체 혹은 문자열)
    function processIncomingData(payload) {
      // ⬇️ 여기에 기존 realtime.html의 onmessage 처리 코드를 옮기세요.
      // 예) 위치 업데이트, 경로 그리기, 모델 배치, 높이 보정 등
      // 아래는 예시(데모): { lon, lat, alt }가 오면 점 업데이트
      try {
        // 예시 포맷 맞추기
        const d = (typeof payload === 'string') ? JSON.parse(payload) : payload;
        if (d && typeof d.lon === 'number' && typeof d.lat === 'number') {
          const alt = typeof d.alt === 'number' ? d.alt : 0;
          state.cesium.entities.add({
            position: Cesium.Cartesian3.fromDegrees(d.lon, d.lat, alt),
            point: { pixelSize: 8, color: Cesium.Color.CYAN.withAlpha(0.9) },
          });
        }
      } catch (e) {
        // 파싱 실패 시 무시 (실제 환경에 맞게 수정)
      }
    }

    // ======= 이벤트 바인딩 =======
    function bindEvents() {
      $('#addRoomBtn').onclick = () => {
        const v = $('#roomUrlInput').value.trim();
        if (!v) return; addRoom(v); $('#roomUrlInput').value = '';
      };
      $('#refreshBtn').onclick = () => discoverAvailable();
      $('#disconnectBtn').onclick = () => disconnect();
      $('#reconnectBtn').onclick = async () => { disconnect(); clearCesiumScene(); await connectActive(); };
      $('#clearBtn').onclick = () => clearCesiumScene();

      // Enter 키로 방 추가
      $('#roomUrlInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('#addRoomBtn').click();
      });
    }

    // ======= 부트스트랩 =======
    (function init() {
      initCesium();
      bindEvents();
      state.rooms = loadRooms();
      renderSidebarRooms();
      renderTabs();

      // 자동 탐색: 옵션
      if (CONFIG.ENABLE_DISCOVERY) {
        discoverAvailable();
      } else {
        $('#availableEmpty').style.display = 'block';
      }

      // 처음 방이 하나라도 있으면 첫 방 활성화
      if (state.rooms.length) activateRoom(state.rooms[0].id);
    })();
  </script>
</body>
</html>
