<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realtime</title>
  <script src="/static/Cesium/Cesium.js"></script>
  <script src="/static/luxon.min.js"></script>
  <link rel="stylesheet" href="/static/Cesium/Cesium.css">
  <link rel="preconnect" href="//fieldy.cdn.ntruss.com">

  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script> <!-- Ensure this is loaded correctly -->

 <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #projectSelector {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      max-height: 400px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 20px;
      color: white;
      overflow-y: auto;
    }
    .project-item {
      margin-bottom: 10px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      cursor: pointer;
    }
    .project-item:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    .project-name, .project-address {
      display: inline-block;
    }
    .project-address {
      float: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 450px;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="projectSelector"></div>
  <div id="dataDisplay" style="position: absolute; top: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.5); padding: 10px; color: white; border-radius: 10px;">Waiting for data...</div>

    <script type="module">
      import setTimeline from "/static/js/timeline.js";
      Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzMjM0YTQ5OS01MTgwLTRjODItYTk0MS04ODQ4ODE2YTdhNTEiLCJpZCI6MzI5MzEwLCJpYXQiOjE3NTQ0NzE0Mzd9.EuurwTHYuKDK-CHcjh1a22P4O6ijJNlb6f2qx8fZctA';

      const viewer = new Cesium.Viewer('cesiumContainer', {
        terrain: Cesium.Terrain.fromWorldTerrain({
          // requestVertexNormals: true
        }),
        terrainExaggeration: 1.0,
        maximumScreenSpaceError: 1,
        timeline: true,
        animation: true,
        shouldAnimate: true
      });
      setTimeline(viewer);
      viewer.scene.globe.enableLighting = true;
      viewer.scene.globe.depthTestAgainstTerrain = true;

    async function loadPaths(){
    //   viewer.scene.primitives.add(
    //     await Cesium.Cesium3DTileset.fromUrl(
    //         "https://tile.googleapis.com/v1/3dtiles/root.json?key=AIzaSyAUOmqO5TvPPYAPN_R68vU_20P2qrOcLdo"
    //     )
    // );
      const osmBuildings = await Cesium.Cesium3DTileset.fromIonAssetId(96188);
      viewer.scene.primitives.add(osmBuildings);
    }

    loadPaths();
    const entityMap = new Map();
    const initializedMap = new Map();

    const socket = io.connect(window.location.protocol + '//' + window.location.host, {
        secure: window.location.protocol === 'https:',
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000
    });

      socket.on('data', async function(data) {
        const batch = Array.isArray(data) ? data : [data];
        document.getElementById('dataDisplay').innerText = `[수신 데이터]\n${JSON.stringify(batch, null, 2)}`;

        let start, end;
        for (const item of batch) {
          const time = Cesium.JulianDate.fromDate(new Date(item.timestamp));
          if (!start || Cesium.JulianDate.lessThan(time, start)) start = time;
          if (!end || Cesium.JulianDate.greaterThan(time, end)) end = time;
          await processPoint(item, time);
        }

        if (start && end) {
          viewer.clock.startTime = start;
          viewer.clock.stopTime = end;
          viewer.clock.currentTime = start;
          viewer.timeline.zoomTo(start, end);
          viewer.clock.shouldAnimate = true;
        }
      });

      async function processPoint(data, time) {
        const { lat, lon, asset_type } = data;
        const position = Cesium.Cartesian3.fromDegrees(lon, lat);
        const [cartesian] = await viewer.scene.clampToHeightMostDetailed(
          [position],
          Array.from(entityMap.values()),
          2
        );
        if (!cartesian) return;
        const cartographicPosition = Cesium.Cartographic.fromCartesian(cartesian);
        const adjustedPosition = Cesium.Cartesian3.fromRadians(
          cartographicPosition.longitude,
          cartographicPosition.latitude,
          cartographicPosition.height
        );

        if (!entityMap.has(asset_type)) {
          let modelUri;
          let labelText;

          if (asset_type === 6) {
            modelUri = './static/assets/dump_truck.glb';
            labelText = '덤프 트럭';
          } else {
            modelUri = './static/assets/dozer.glb';
            labelText = asset_type === 1 ? '불도저' : '그레이더';
          }

          const pos = new Cesium.SampledPositionProperty();
          const velocityOrientation = new Cesium.VelocityOrientationProperty(pos);
          const fixedRotation = Cesium.Quaternion.IDENTITY;
          const orientation = new Cesium.CallbackProperty(function(time, result) {
            const base = velocityOrientation.getValue(time, result);
            if (!base) return fixedRotation;
            return Cesium.Quaternion.multiply(base, fixedRotation, result);
          }, false);

          entityMap.set(
            asset_type,
            viewer.entities.add({
              position: pos,
              orientation: orientation,
              model: {
                uri: modelUri,
                scale: 3,
              },
              label: {
                text: labelText,
                font: '14pt sans-serif',
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 2,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                pixelOffset: new Cesium.Cartesian2(0, -50),
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                heightReference: Cesium.HeightReference.NONE,
                scaleByDistance: new Cesium.NearFarScalar(100, 1.2, 2000, 0.6),
                translucencyByDistance: new Cesium.NearFarScalar(100, 1.0, 1500, 0.8),
                backgroundColor: Cesium.Color.fromAlpha(Cesium.Color.BLACK, 0.7),
                backgroundPadding: new Cesium.Cartesian2(8, 4),
                showBackground: true,
              },
              path: new Cesium.PathGraphics({
                leadTime: 0,
                trailTime: 60,
                width: 10,
                material: new Cesium.PolylineGlowMaterialProperty({
                    glowPower: 1,
                    color: Cesium.Color.RED
                  })
                })
            })
          );
        }

        const entity = entityMap.get(asset_type);
        if (!initializedMap.get(asset_type)) {
          const past = Cesium.JulianDate.addSeconds(time, -1, new Cesium.JulianDate());
          entity.position.addSample(past, adjustedPosition);
          initializedMap.set(asset_type, true);
        }
        entity.position.addSample(time, adjustedPosition);
      }

    socket.on('disconnect', function() {
      console.log('WebSocket connection closed');
      // alert('WebSocket connection closed');
    });

    socket.on('connect_error', function(error) {
      console.error('WebSocket error:', error);
      // alert('WebSocket error');
    });

    console.log('WebSocket script executed');

    const projects = [
      { name: '김포-파주 실증 현장', address: '경기도 김포시 양촌읍 흥신리 193-174', lat: 37.6754867, lon: 126.6303532 },
      { name: '파주 고속도로', address: '경기도 파주시 법원읍 보광로 1704-74', lat: 37.8296017, lon: 126.8712626 }
      // Add more projects as needed
    ];

    $(document).ready(function() {
      const projectSelector = $('#projectSelector');
      projects.forEach(project => {
        const projectItem = $(`
          <div class="project-item" data-address="${project.address}">
            <span class="project-name">${project.name}</span>
            <span class="project-address">${project.address}</span>
          </div>
        `);
        projectItem.on('click', function() {
          projectSelector.hide();
          const position = Cesium.Cartesian3.fromDegrees(project.lon, project.lat,
            Cesium.Cartographic.fromDegrees(project.lon, project.lat).height + 600);
          viewer.camera.flyTo({
            destination: position
          });
        });
        projectSelector.append(projectItem);
      });
    });
  </script>

  <!--script src="/static/js/new.js"></script-->
</body>
</html>
